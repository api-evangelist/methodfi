envelope:
  request_error: '{ success: false, data: { error: { type, code, sub_type, message } }, message }'
  resource_error: 'set on the resource object''s `error` property: { type, code, sub_type, message }'
  fields:
    type: >-
      High-level error class. Request errors: INVALID_AUTHORIZATION, INVALID_REQUEST,
      API_ERROR. Resource errors use resource-specific types (e.g. PAYMENT_FAILED).
    code: HTTP status code (request errors) or a 5-digit resource error code (resource errors).
    sub_type: Fine-grained machine-readable identifier of the specific error.
    message: Human-readable description.
http_status_codes:
- status: 200
  meaning: OK — request succeeded.
- status: 400
  meaning: Bad Request — unacceptable request, often a missing/invalid parameter.
- status: 401
  meaning: Unauthorized — no valid API key provided.
- status: 403
  meaning: Forbidden — API key lacks permission for the request.
- status: 404
  meaning: Not Found — the requested resource does not exist.
- status: 422
  meaning: Unprocessable Entity — validation failed (present in OpenAPI responses).
- status: 429
  meaning: Too Many Requests — rate limit exceeded (sub_type TOO_MANY_REQUESTS).
- status: 500
  meaning: Server Error — something went wrong on Method's end.
- status: 503
  meaning: Service Unavailable — idempotency store unavailable (sub_type IDEMPOTENCY_UNAVAILABLE).
- status: 504
  meaning: Gateway Timeout (present in OpenAPI responses).
