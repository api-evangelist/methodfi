aid: methodfi
name: MethodFi
description: Method (Method Financial) is the infrastructure layer for consumer liability data and payments.
  Its API lets developers create entities, verify identity, and use Connect to discover a user's complete
  liability picture across 15,000+ institutions (credit cards, auto loans, student loans, mortgages, personal
  loans) without credential sharing, then normalize that data and move money via ACH to pay down those
  liabilities. Additional products include credit scores, card-brand enrichment, financial attributes,
  transactions, updates/subscriptions for monitoring, reports, and embeddable UI (Opal/Elements). Method
  powers lending, personal finance management, and commerce/card-linking use cases.
