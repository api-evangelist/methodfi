generated: '2026-07-20'
method: searched
source: https://docs.methodfi.com/opal/overview
description: >-
  Method ships embeddable client-side UI components for identity verification, account
  discovery, and card connect. Opal is the next-generation embedded surface; Elements
  is the prior generation still supported. These are distinct from the server SDKs in
  packages/methodfi-packages.yml.
families:
- name: Opal
  summary: >-
    Method's next-generation embeddable financial components — identity verification,
    account/liability discovery (Connect), card connect, and account verification —
    surfaced as a hosted UI driven by an Opal session token (otkn_).
  docs: https://docs.methodfi.com/opal/overview
  surfaces:
  - Identity Verification
  - Connect (account discovery)
  - Card Connect
  - Account Verification
  - Transactions
  loaders:
  - kind: javascript
    name: Opal JS SDK
    url: https://static.methodfi.com/opal/v1/stable/init.js
    install: '<script src="https://static.methodfi.com/opal/v1/stable/init.js"></script>'
  - kind: react
    name: "@methodfi/opal-react"
    url: https://www.npmjs.com/package/@methodfi/opal-react
    install: npm install @methodfi/opal-react
  - kind: react-native
    name: "@methodfi/opal-react-native"
    url: https://www.npmjs.com/package/@methodfi/opal-react-native
    install: npm install @methodfi/opal-react-native
- name: Elements
  summary: >-
    Prior-generation embeddable frontend libraries for integrating Method flows.
    A migration guide exists for moving Elements integrations to Opal.
  docs: https://docs.methodfi.com/elements/overview
  migration: https://docs.methodfi.com/opal/migration_guide
  loaders:
  - kind: react
    name: react-method-elements
    url: https://www.npmjs.com/package/react-method-elements
    install: npm install react-method-elements
  - kind: react-native
    name: react-native-method-elements
    url: https://www.npmjs.com/package/react-native-method-elements
    install: npm install react-native-method-elements
  - kind: javascript
    name: Element JS SDK
    docs: https://docs.methodfi.com/libraries/js-sdk
